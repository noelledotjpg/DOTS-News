title = "New Clown behavior"
date = 2026-07-01T03:44:33
body = '''
The circus is back in town. Clowns were kind of a pushover, so now they can kick you around and give you status effects.

The status effect doubles all knockback you receive and launches you upwards any time you take damage.

They still have their old jump attack. They just have two attacks now.

![video: New Clown behavior](media/1521723157495414904.mp4)
'''
