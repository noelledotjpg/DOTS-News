title = "Menu revamps, news menu and website"
date = 2025-10-16T11:29:09
body = '''
Minecraft's menus have always been a bit boring, so Disorder of the Stone revamps them. Buttons can be made of different materials now, and menus use multiple fonts.

A News menu has also been added. It connects to the (very unfinished) Disorder of the Stone website from within the game, so players can easily check whether updates have been released, or catch new teasers, status updates and more.

Everything shown here is subject to change. Menus will likely use at most 2-3 different types of buttons; the title screen has more than that for this demonstration.

