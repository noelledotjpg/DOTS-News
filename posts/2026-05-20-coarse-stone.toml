title = "Coarse stone"
date = 2026-05-20T05:00:07
body = '''
If you can smelt stone to get light gray Smooth Stone blocks, you should be able to make dark gray Coarse Stone blocks too, so now you can.

Despite looking similar to modern Minecraft's Deepslate or BTA's Basalt blocks, they won't generate outside of structures.

![image: Coarse stone](media/1506521886924869632.png)
'''
