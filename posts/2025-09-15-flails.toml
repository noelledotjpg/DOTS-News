title = "Flails"
date = 2025-09-15T04:13:49
body = '''
Flails are a new type of weapon, added for a bit of variety.

They deal semi-randomized damage based on their tier. A wooden flail can deal anywhere from 1 to 6 damage, a diamond flail anywhere from 5 to 10, and so on. With luck you'll hit a lot harder than you would with a sword, but you're equally likely to be unlucky and deal a lot less. Flails can't be used to block.

![image: Flails](media/1417000431439319151.png)

![video: Flails](media/1417228196700487731.mp4)
