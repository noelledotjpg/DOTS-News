title = "Sulfur"
date = 2026-04-02T00:39:02
body = '''
Sulfur is a new ore that is used to make gunpowder. Sulfur Ore starts generating a little below surface level and explodes when mined, so be careful, especially since it can cause chain reactions.

![image: Sulfur](media/1489061566233182379.png)

It may look similar to Gold Ore, but it emits particles and makes a hissing sound when you start mining it.

*(This is not an April Fools' joke.)*
'''
