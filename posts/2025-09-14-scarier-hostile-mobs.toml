title = "Scarier hostile mobs"
date = 2025-09-14T23:09:25
body = '''
Below Y=0, new and more terrifying hostile mobs will spawn. They tend to be a lot tougher to deal with than the ones on the surface, but most of the new ores only generate below Y=0, so the risk may well be worth taking.

