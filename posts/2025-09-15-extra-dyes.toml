title = "Extra dyes"
date = 2025-09-15T01:43:30
body = '''
Thanks to Dye Depot, a mod by another author, Disorder of the Stone has twice as many dyes as vanilla. They can be used to make coloured wool, glass and carpet, and can be applied to sheep and leather armour.

The one casualty: White Stained Glass.

![image: Extra dyes](media/1416962602881515601.png)
'''
