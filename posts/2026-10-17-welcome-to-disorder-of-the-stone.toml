body = '''
Disorder of the Stone is a mod(pack) focused on continuing development of Alpha Minecraft - but in a completely different direction. No Nether, no beds - just you, your creativity, whatever you can craft and build, and a lot of terrifying monsters out to get you.

> Development is going steady!
