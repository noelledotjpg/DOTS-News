title = "Metal bars"
date = 2026-01-10T05:46:42
body = '''
Metal Bars are a thing now. They don't bend at corners like modern Minecraft's Iron Bars, but they have a unique spiked texture variant that shows up at the top of any you place on each other. You can also mix them without issue.

![image: Metal bars](media/1459423188416204933.png)
'''
