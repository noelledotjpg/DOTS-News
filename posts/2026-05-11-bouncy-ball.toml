title = ":O)"
date = 2026-05-11T03:36:57
body = '''
Killing a Clown now has a small chance to drop the Bouncy Ball it usually stands on top of. You can't stand on it and use it for transportation, but you can kick and punch it around, and it has physics. Try making some minigames with it.

Other entities can also interact with these.

![image: :O)](media/1503239467325063278.png)
'''
