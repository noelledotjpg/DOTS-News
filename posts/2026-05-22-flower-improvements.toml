title = "Flower improvements"
date = 2026-05-22T15:53:29
body = '''
You can now place multiple flowers of the same type in a single block, or craft them together to make Wildflower Mix.

There are also giant flowers, and the petals they occasionally drop can be crafted into regular-sized flowers. There are 3 types of giant flowers, but they wouldn't all fit in the image.

![image: Flower improvements](media/1507411085198757918.png)
