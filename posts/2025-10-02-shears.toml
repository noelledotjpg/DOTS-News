title = "Shears"
date = 2025-10-02T23:01:42
body = '''
Shears have been introduced. A Nostalgic Tweaks bug prevents punching sheep dyed any of the colours added by Dye Depot to get wool, so shears were needed.

They function like vanilla shears, except they're tiered.

![image: Shears](media/1423444867010269246.png)
