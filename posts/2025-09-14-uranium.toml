title = "Uranium"
date = 2025-09-14T22:01:25
body = '''
A new ore has been found at the very bottom of the world: **Uranium**. Use it as a supercharged fuel in furnaces, or to make ultra-blastproof Uranium Glass. Just be careful when mining it.

![image: Uranium](media/1416906713574936728.png)

There is probably more to do with it, but the leading scientists still haven't figured out how to split the voxel.
'''
