<!DOCTYPE html>
<html lang="en">
  <head>

    <title>Page Not Found | Disorder of the Stone News</title>
    <base href="/DOTS-News/">
    <link rel="stylesheet" href="css/launcher.css">
    <script>
      (function () {
        var m = location.pathname.match(/^\/DOTS-News\/site(\/.*)?$/);
        if (m) { location.replace("/DOTS-News" + (m[1] || "/") + location.search + location.hash); }
      }());
    </script>
  </head>

  <body data-page="notfound">
    <table width="100%" height="100%">

          <td style="padding-left: 16px;padding-right: 16px;">

              <tbody>
                <tr>
                  <td>
                    <h1 id="site-title"><a href="./"><img class="logo" src="img/logonews.png" width="1305" height="279" alt="Disorder of the Stone News"></a></h1>
                  </td>
                </tr>
              </tbody>
            </table>
            <div class="container">
              <div id="posts">
                <h3>404: Page not found</h3>
                <p>That page doesn't exist, or it has been moved.</p>
                <p class="post-nav"><a href="./">Back to the news</a></p>
              </div>
              <p class="disclaimer" id="disclaimer"></p>
            </div>
          </td>
          <td class="sidebar" id="sidebar" width="180px" valign="top"></td>
        </tr>
      </tbody>
    </table>

    <script src="js/config.js"></script>
    <script src="js/news.js"></script>
  </body>
</html>
